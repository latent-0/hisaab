# Render Blueprint, deploy Hisaab as a free Docker web service.
# In Render: New → Blueprint → connect github.com/latent-0/hisaab.
# Secret keys (sync:false) are entered once in the Render dashboard.
services:
  - type: web
    name: hisaab
    runtime: docker
    plan: free
    region: singapore # closest free region to India
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HISAAB_SEED
        value: "true"
      - key: LLM_PROVIDER
        value: groq
      - key: VOICE_PROVIDER
        value: sarvam
      - key: OCR_PROVIDER
        value: mock
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: SARVAM_TTS_MODEL
        value: "bulbul:v3"
      - key: SARVAM_TTS_SPEAKER
        value: anushka
      - key: SESSION_SECRET
        generateValue: true
      # --- secrets: set these in the Render dashboard (Environment tab) ---
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: COGNEE_API_BASE
        sync: false
      - key: COGNEE_API_KEY
        sync: false
      - key: COGNEE_TENANT_ID
        sync: false
      - key: AUTOMATION_TOKEN
        sync: false
